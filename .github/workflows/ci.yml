name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The report extra is installed here but not in the repair workflow, so a
      # broken import in the drawing code shows up on a pull request rather
      # than in a run that was meant to publish a feed.
      - name: Install
        run: pip install -e ".[dev,report]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q
