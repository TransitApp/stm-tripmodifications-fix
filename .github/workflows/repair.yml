name: Repair and publish

on:
  # Offset from the top of the hour: GitHub delays scheduled runs most when
  # the hour turns.
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      rebuild_pdf:
        description: "Rebuild the PDF map reports"
        type: boolean
        default: false
      rebuild_web:
        description: "Read the STM website again, whatever its age"
        type: boolean
        default: false

concurrency:
  group: repair
  cancel-in-progress: false

permissions:
  contents: write

env:
  PDF_NAME: stm-tripmodifications-report.pdf
  WEB_PDF_NAME: stm-detours-report.pdf
  WEB_DIR: web
  # Reading the website costs about 570 requests to stm.info, and detours turn
  # over on the order of hours, so it is read once an hour rather than on every
  # ten-minute run. Measured against the published feed's own age, so a dropped
  # or delayed scheduled run does not skip an hour.
  WEB_MAX_AGE_MINUTES: "55"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Take the published PDF and the report it was drawn from off the output
      # branch. Both are needed below: the PDF to carry forward, the report to
      # tell whether it still shows the current repairs. The website feed is
      # carried too, so a bad reply from stm.info leaves the last good one up
      # rather than removing it.
      - name: Carry the published output forward
        id: carry
        run: |
          set -euo pipefail

          carried=no
          if git fetch --depth=1 --no-tags origin output 2>/dev/null; then
            if git cat-file -e "FETCH_HEAD:${PDF_NAME}" 2>/dev/null; then
              git show "FETCH_HEAD:${PDF_NAME}" > "${PDF_NAME}"
              git show "FETCH_HEAD:report.json" > published-report.json 2>/dev/null || true
              carried=yes
            fi
            if git cat-file -e "FETCH_HEAD:${WEB_DIR}/tripmodifications.pb" 2>/dev/null; then
              mkdir -p carried-web
              for name in tripmodifications.pb tripmodifications.json \
                          report.md report.json metadata.json "${WEB_PDF_NAME}"; do
                git show "FETCH_HEAD:${WEB_DIR}/$name" > "carried-web/$name" 2>/dev/null || true
              done
              # The redirect creates the file even when git has nothing to show,
              # so drop the empties rather than treat them as carried files.
              find carried-web -type f -empty -delete
            fi
          fi
          echo "carried=$carried" >> "$GITHUB_OUTPUT"

          # The static feed cache is keyed by the hour rather than by the run:
          # at six runs an hour, keying by run would write a 45 MB entry every
          # ten minutes and churn the cache for a zip that changes a few times
          # a year.
          echo "hour=$(date -u +%Y-%m-%dT%H)" >> "$GITHUB_OUTPUT"

          echo "Carried an existing PDF: $carried"

      # Only the repair runs every ten minutes, so it alone installs by default.
      # The drawing dependencies come later, and only on the runs that draw.
      - name: Install
        run: pip install .

      # The restore-key picks up the newest previous entry, so a new hour
      # starts from the last hour's zip and only conditional-GETs it.
      - name: Restore the static feed cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: static-gtfs-${{ steps.carry.outputs.hour }}
          restore-keys: static-gtfs-

      # --save-realtime keeps the bytes this run fetched, so drawing the maps
      # below asks STM for nothing further.
      - name: Repair
        env:
          STM_API_USERNAME: ${{ secrets.STM_API_USERNAME }}
          STM_API_PASSWORD: ${{ secrets.STM_API_PASSWORD }}
        run: |
          python -m tmfix \
            --verbose \
            --output-dir output \
            --save-realtime .cache/realtime-this-run.pb

      - name: Decide whether to read the website
        id: web_plan
        run: |
          set -euo pipefail

          reason=""
          if [ "${{ inputs.rebuild_web }}" = "true" ]; then
            reason="asked for by the dispatch"
          elif [ ! -f carried-web/metadata.json ]; then
            reason="the output branch has no website feed"
          else
            age="$(python -m tmweb.age carried-web/metadata.json)"
            if [ "$age" -ge "${WEB_MAX_AGE_MINUTES}" ]; then
              reason="the published one is $age minutes old"
            fi
          fi

          if [ -n "$reason" ]; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
            echo "Reading the website: $reason"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"
            echo "Keeping the published website feed: it is still fresh"
          fi

      # Built from the same static GTFS the repair just parsed, so it costs one
      # cache hit and half a minute of paced requests to stm.info. A failure
      # here must not stop the repaired feed publishing.
      - name: Build the feed from the STM website
        if: steps.web_plan.outputs.build == 'yes'
        continue-on-error: true
        run: python -m tmweb --verbose --output-dir output-web

      # The maps only change when the repairs do, and detours turn over on the
      # order of hours, so redrawing every ten minutes would download map tiles
      # to produce the same pages again. The fingerprint ignores the feed
      # timestamp, the sampled trip and the measured distances — see
      # tmfix/signature.py.
      - name: Decide whether to draw the PDF
        id: plan
        run: |
          set -euo pipefail

          reason=""
          if [ "${{ inputs.rebuild_pdf }}" = "true" ]; then
            reason="asked for by the dispatch"
          elif [ "${{ steps.carry.outputs.carried }}" = "no" ]; then
            reason="the output branch has no PDF"
          elif [ ! -f published-report.json ]; then
            reason="the published PDF has no report to compare against"
          else
            published="$(python -m tmfix.signature published-report.json)"
            current="$(python -m tmfix.signature output/report.json)"
            if [ "$published" != "$current" ]; then
              reason="the repairs changed ($published -> $current)"
            fi
          fi

          if [ -n "$reason" ]; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
            echo "Drawing the PDF: $reason"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"
            echo "Keeping the published PDF: the repairs are unchanged"
          fi

      # Same rule as the repair report, against the same kind of fingerprint:
      # the maps change only when the detours do. A run that did not read the
      # website has nothing new to draw and keeps the published PDF.
      - name: Decide whether to draw the website map report
        id: web_pdf
        run: |
          set -euo pipefail

          if [ ! -f output-web/report.json ]; then
            echo "build=no" >> "$GITHUB_OUTPUT"
            echo "Keeping the published website PDF: the website was not read this run"
            exit 0
          fi

          reason=""
          if [ "${{ inputs.rebuild_pdf }}" = "true" ]; then
            reason="asked for by the dispatch"
          elif [ ! -f "carried-web/${WEB_PDF_NAME}" ]; then
            reason="the output branch has no website PDF"
          elif [ ! -f carried-web/report.json ]; then
            reason="the published PDF has no report to compare against"
          else
            published="$(python -m tmweb.signature carried-web/report.json)"
            current="$(python -m tmweb.signature output-web/report.json)"
            if [ "$published" != "$current" ]; then
              reason="the detours changed ($published -> $current)"
            fi
          fi

          if [ -n "$reason" ]; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
            echo "Drawing the website PDF: $reason"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"
            echo "Keeping the published website PDF: the detours are unchanged"
          fi

      - name: Install the drawing dependencies
        if: steps.plan.outputs.build == 'yes' || steps.web_pdf.outputs.build == 'yes'
        run: pip install ".[report]"

      - name: Draw the PDF map report
        if: steps.plan.outputs.build == 'yes'
        timeout-minutes: 20
        run: |
          python -m tmreport \
            --realtime-file .cache/realtime-this-run.pb \
            --output "${PDF_NAME}"

      # One page per detour, around two hundred of them, so this is the longest
      # step of the runs that draw it. It reads the feed written above and asks
      # stm.info for nothing.
      - name: Draw the website map report
        if: steps.web_pdf.outputs.build == 'yes'
        timeout-minutes: 25
        run: |
          python -m tmreport.web \
            --feed output-web/tripmodifications.pb \
            --output "output-web/${WEB_PDF_NAME}"

      # The output branch keeps no history: each run pushes a brand new
      # repository over it, so only the current feed is ever stored.
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          cp output/tripmodifications.pb "$publish_dir/"
          cp output/tripmodifications.json "$publish_dir/"
          cp output/report.md "$publish_dir/"
          cp output/report.json "$publish_dir/"
          cp output/metadata.json "$publish_dir/"
          cp "${PDF_NAME}" "$publish_dir/"
          cp .github/output-readme.md "$publish_dir/README.md"

          # This run's website feed if it read one, else the one already published.
          if [ -f output-web/tripmodifications.pb ]; then
            if [ ! -f "output-web/${WEB_PDF_NAME}" ] && [ -f "carried-web/${WEB_PDF_NAME}" ]; then
              cp "carried-web/${WEB_PDF_NAME}" output-web/
            fi
            cp -r output-web "$publish_dir/${WEB_DIR}"
          elif [ -f carried-web/tripmodifications.pb ]; then
            cp -r carried-web "$publish_dir/${WEB_DIR}"
          else
            echo "No website feed to publish"
          fi

          cd "$publish_dir"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Repaired feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            output
