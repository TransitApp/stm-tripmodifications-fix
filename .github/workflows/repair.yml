name: Repair and publish

on:
  # Offset from the top of the hour: GitHub delays scheduled runs most when
  # the hour turns.
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      # Keyed on the run so every run writes a fresh entry; the restore-key
      # picks up the newest previous one. The parsed static feed is only
      # rebuilt when STM publishes a new zip.
      - name: Restore the static feed cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: static-gtfs-${{ github.run_id }}
          restore-keys: static-gtfs-

      - name: Repair
        env:
          STM_API_USERNAME: ${{ secrets.STM_API_USERNAME }}
          STM_API_PASSWORD: ${{ secrets.STM_API_PASSWORD }}
        run: python -m tmfix --verbose --output-dir output

      # The output branch keeps no history: each run pushes a brand new
      # repository over it, so only the current feed is ever stored.
      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          cp output/* "$publish_dir/"
          cp .github/output-readme.md "$publish_dir/README.md"

          cd "$publish_dir"
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Repaired feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            output
