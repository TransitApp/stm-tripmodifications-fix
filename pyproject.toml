[project]
name = "stm-tripmodifications-fix"
version = "0.1.0"
description = "Repair STM GTFS-RT TripModifications whose cancelled range is shorter than the detour"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gtfs-realtime-bindings>=2.2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Only the map report needs these. The ten-minute repair path installs neither.
report = ["matplotlib>=3.8", "contextily>=1.6"]

[project.scripts]
tmfix = "tmfix.__main__:main"
tmreport = "tmreport.__main__:main"
tmweb = "tmweb.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The report prints ranges as "0-26 m" with an en dash on purpose.
allowed-confusables = ["\u2013", "\u2014"]

[tool.ruff.lint.isort]
known-first-party = ["tmfix", "tmreport", "tmweb", "fixtures", "web_fixtures"]
